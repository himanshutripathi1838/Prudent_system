<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="30%" stop-color="#fda085"/>
      <stop offset="70%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#ffe699"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bg)"/>
  <rect width="1000" height="650" fill="url(#grid)"/>

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="950" height="600" fill="none" stroke="url(#gold)" stroke-width="3" rx="12"/>
  <rect x="35" y="35" width="930" height="580" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1" rx="8"/>

  <!-- Decorative Corner Accents -->
  <path d="M 25 65 L 65 25 M 25 75 L 75 25 M 975 65 L 935 25 M 975 75 L 925 25 M 25 585 L 65 625 M 25 575 L 75 625 M 975 585 L 935 625 M 975 575 L 925 625" stroke="url(#gold)" stroke-width="2"/>

  <!-- Header Banner -->
  <text x="500" y="95" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="22" letter-spacing="6" fill="#38bdf8">
    CIO TECH OUTLOOK
  </text>
  
  <text x="500" y="125" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="500" font-size="13" letter-spacing="4" fill="#94a3b8">
    MAGAZINE SPECIAL EDITION — 2023
  </text>

  <line x1="300" y1="145" x2="700" y2="145" stroke="url(#gold-light)" stroke-width="1.5"/>

  <!-- Award Title -->
  <text x="500" y="195" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="1">
    10 MOST PROMISING
  </text>
  
  <text x="500" y="235" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="24" fill="url(#gold-light)" letter-spacing="2">
    RAILWAY TECHNOLOGY SOLUTION PROVIDERS
  </text>

  <!-- Awarded To -->
  <text x="500" y="295" text-anchor="middle" font-family="sans-serif" font-style="italic" font-size="16" fill="#cbd5e1">
    This certification is proudly presented to
  </text>

  <!-- Company Name -->
  <rect x="200" y="320" width="600" height="70" fill="url(#cyan-glow)" rx="8" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="500" y="365" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="1.5">
    PRUDENT SYSTEMS PVT. LTD.
  </text>

  <!-- Citation / Description -->
  <text x="500" y="430" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" width="700">
    Recognized for outstanding innovation in Railway Onboard Electronics, GPS OMS,
  </text>
  <text x="500" y="452" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">
    Digital Speedometers, and Industrial IoT Edge-to-Cloud Platforms.
  </text>

  <!-- Seal / Badge Stamp (Bottom Left) -->
  <g transform="translate(220, 525)">
    <circle cx="0" cy="0" r="42" fill="url(#bg)" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#gold-light)" stroke-dasharray="4,2" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="url(#gold)">VERIFIED</text>
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff">2023</text>
    <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#38bdf8">ANNUAL AWARD</text>
  </g>

  <!-- Signatures / Footer -->
  <g transform="translate(780, 525)">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#64748b" stroke-width="1"/>
    <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#e2e8f0">CIO Tech Outlook</text>
    <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">Editorial Board</text>
  </g>
</svg>
